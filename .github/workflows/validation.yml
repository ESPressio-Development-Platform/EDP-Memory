name: Memory Validation

on:
  push:
    branches:
      - main
      - feature/logging-v1
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EDP-Memory
        uses: actions/checkout@v4
        with:
          path: EDP-Memory

      - name: Checkout EDP-System
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-System
          path: EDP-System

      - name: Checkout EDP-Platform
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-Platform
          path: EDP-Platform
      - name: Checkout EDP-BoundedTopology
        uses: actions/checkout@v4
        with:
          repository: ESPressio-Development-Platform/EDP-BoundedTopology
          path: EDP-BoundedTopology

      - name: GCC host and compile-fail validation
        run: bash EDP-Memory/tests/run_host_tests.sh

      - name: Clang host and compile-fail validation
        env:
          CXX: clang++
        run: bash EDP-Memory/tests/run_host_tests.sh

      - name: UBSan host validation
        env:
          EDP_MEMORY_SANITIZER_MODE: undefined
        run: bash EDP-Memory/tests/run_host_tests.sh

  platform-builds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EDP-Memory
        uses: actions/checkout@v4

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build all five demo families for Arduino-ESP32 and ESP-IDF
        shell: bash
        run: |
          set -euo pipefail
          # All provider selections must compile through published owner packages.
          for family in indexed-object-pool-basic memory-operations-basic object-pool-basic shared-overflow-basic topology-teardown-basic; do
            for target in PlatformIO_Arduino PlatformIO_ESP-IDF; do
              echo "BUILD ${family} / ${target}"
              pio run -d "demos/${family}/${target}"
            done
          done
